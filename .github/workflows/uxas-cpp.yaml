on:
    push:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
    pull_request:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
    workflow_dispatch:
    schedule:
        - cron: '20 3 * * 4'

name: Build and Test UxAS C++
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                env: [
                    {os: ubuntu-24.04, python: '3.12'},
                    {os: ubuntu-26.04, python: '3.14'}
                ]
                component: [uxas]
                qualifier: [scenario=release, scenario=gcov]
        runs-on: ${{ matrix.env.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  path: OpenUxAS
            - name: Check GCC version (Deleteme)
              run: |
                    gcc --version
                    g++ --version

            - name: Set up python ${{ matrix.env.python }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.env.python }}

            - name: Set up java
              uses: actions/setup-java@v4
              with:
                  java-version: '11'
                  distribution: 'adopt'

            - name: Install infrastructure
              run: |
                  cd OpenUxAS
                  infrastructure/install -vv --no-gnat --no-java -y

            - name: Build OpenUxAS C++
              run: |
                  cd OpenUxAS
                  ./anod -v build ${{ matrix.component }} --qualifier=${{ matrix.qualifier}}

            - name: Show compile commands for visilibity.cpp (Deleteme)
              run: |
                  echo "=== Searching for visilibity.o build logs ==="
                  find OpenUxAS/infrastructure/sbx/x86_64-linux/uxas-gcov/build -name "visilibity.o" -exec sh -c '
                  echo "--- Found object: {} ---"
                  echo "Trying to reconstruct compile command..."
                  # Show the dependency file if it exists
                  depfile="{}.d"
                  if [ -f "$depfile" ]; then
                      echo "--- Dependency file ---"
                      cat "$depfile"
                  fi
                  ' \;

            - name: Force verbose rebuild of visilibity.cpp (Deleteme)
              run: | 
                  cd OpenUxAS
                  rm -f infrastructure/sbx/x86_64-linux/uxas-gcov/build/src/cpp/VisilibityLib/visilibity.o
                  rm -f infrastructure/sbx/x86_64-linux/uxas-gcov/build/src/cpp/VisilibityLib/visilibity.gcno
                  make DEBUG_BUILD=true ENABLE_COVERAGE=true \
                   OBJECT_DIR=infrastructure/sbx/x86_64-linux/uxas-gcov/build \
                   src/cpp/VisilibityLib/visilibity.o

            - name: Test OpenUxAS C++
              run: |
                  cd OpenUxAS/tests/cpp
                  ./run-tests --qualifier=${{ matrix.qualifier}}
